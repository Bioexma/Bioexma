    <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>5 Estilos de Colores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color 0.6s, color 0.6s;
    }

    h1 {
      margin-top: 50px;
    }

    button {
      margin: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.4s, color 0.4s;
    }

    /* ====== Estilos ====== */
    .estilo1 {
      background-color: #e3f2fd;
      color: #0d47a1;
    }
    .estilo1 button {
      background-color: #1565c0;
      color: white;
    }
    .estilo1 button:hover {
      background-color: #0d47a1;
    }

    .estilo2 {
      background-color: #fce4ec;
      color: #880e4f;
    }
    .estilo2 button {
      background-color: #d81b60;
      color: white;
    }
    .estilo2 button:hover {
      background-color: #880e4f;
    }

    .estilo3 {
      background-color: #fff3e0;
      color: #e65100;
    }
    .estilo3 button {
      background-color: #fb8c00;
      color: white;
    }
    .estilo3 button:hover {
      background-color: #e65100;
    }

    .estilo4 {
      background-color: #e8f5e9;
      color: #1b5e20;
    }
    .estilo4 button {
      background-color: #43a047;
      color: white;
    }
    .estilo4 button:hover {
      background-color: #1b5e20;
    }

    .estilo5 {
      background-color: #ede7f6;
      color: #4a148c;
    }
    .estilo5 button {
      background-color: #7b1fa2;
      color: white;
    }
    .estilo5 button:hover {
      background-color: #4a148c;
    }
  </style>
</head>
</BODY>
</html>
