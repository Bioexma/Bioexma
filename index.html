cp<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bioexma</title>
    <!DOCTYPE html>
<html lang="es">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
      background: #f4f6f7;
    }

    img {
      transition: width 0.5s, height 0.5s;
      border-radius: 10px;
    }

    button {
      margin: 10px;
      padding: 12px 18px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background-color: #00796b;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>
  <h1>Cambiar tamaño de la imagen</h1>
  
  <!-- Tu imagen -->
  <img id="celula" src="43ebaf0d-64e1-457c-8642-4f32d2c3132d.png" width="300" alt="División celular">

  <br><br>
  <!-- Botones para cambiar tamaño -->
  <button onclick="cambiarTamaño(200)">Pequeño</button>
  <button onclick="cambiarTamaño(300)">Mediano</button>
  <button onclick="cambiarTamaño(500)">Grande</button>
  <button onclick="cambiarTamaño(700)">Muy grande</button>

  <script>
    function cambiarTamaño(nuevoAncho) {
      document.getElementById("celula").width = nuevoAncho;
    }
  </script>
</body>
</html>
